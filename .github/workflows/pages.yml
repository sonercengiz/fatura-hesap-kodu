name: Yayınla (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    # Sabit sürüm: Playwright 1.58 ubuntu-latest'in yeni sürümünü (26.04) desteklemiyor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      # Chrome yerleşik XSLT'yi kaldırıyor: fatura görseli yerleşik / yok / bozuk motorda aynı çizilmeli (polyfill yolu)
      - name: Tarayıcı testi — XSLT motorları
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw" && npm init -y > /dev/null && npm i playwright@1.58.0 --silent
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE"
          ln -sfn "$RUNNER_TEMP/pw/node_modules/playwright" node_modules/playwright
          ln -sfn "$RUNNER_TEMP/pw/node_modules/playwright-core" node_modules/playwright-core
          node test/demo/make-demo.mjs "$RUNNER_TEMP/demo"
          pnpm preview --port 5179 --strictPort &
          for i in $(seq 30); do curl -sf http://localhost:5179/ > /dev/null && break; sleep 1; done
          DEMO_DIR="$RUNNER_TEMP/demo" PW_CHANNEL= node test/xslt-engines-e2e.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
